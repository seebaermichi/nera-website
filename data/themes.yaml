  audience:
      en: A plain, general-purpose blog — black on white, system fonts, dates in the margin.
      de: Ein schlichtes Blog für alles — schwarz auf weiß, Systemschriften, Datum am Rand.
      es: Un blog sencillo para todo — negro sobre blanco, fuentes del sistema, fechas en el margen.
  starters:
      - blog
  demo: /themes/blog/plain/

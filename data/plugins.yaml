# The plugin catalog of /plugins/ and llms.txt, read by plugin-page-data.
- name: Canonical links
  package: '@nera-static/plugin-canonical-links'
  description:
      en: Adds canonical and alternate-language <link> tags for SEO.
      de: Fügt kanonische und alternativsprachige <link>-Tags für SEO hinzu.
      es: Añade etiquetas <link> canónicas y de idioma alternativo para SEO.
  url: https://github.com/seebaermichi/nera-plugin-canonical-links
- name: Code blocks
  package: '@nera-static/plugin-code-blocks'
  description:
      en: Highlights fenced code blocks at build time, with a file name bar, copy button and shell prompts.
      de: Hebt Codeblöcke beim Build hervor, mit Dateinamen-Leiste, Kopier-Button und Shell-Prompts.
      es: Resalta bloques de código durante el build, con barra de nombre de archivo, botón de copiar y prompts de shell.
  url: https://github.com/seebaermichi/nera-plugin-code-blocks
- name: Consent
  package: '@nera-static/plugin-consent'
  description:
      en: Adds a consent banner and settings dialog, and keeps scripts and embeds inert until the visitor agrees — or just an info notice when nothing needs consent.
      de: Fügt ein Consent-Banner und einen Einstellungsdialog hinzu und hält Skripte und Einbettungen inaktiv, bis Besucher zustimmen — oder nur einen Hinweis, wenn nichts eine Einwilligung braucht.
      es: Añade un banner de consentimiento y un diálogo de ajustes, y mantiene scripts e incrustaciones inactivos hasta que el visitante acepte — o solo un aviso informativo cuando nada requiere consentimiento.
  url: https://github.com/seebaermichi/nera-plugin-consent
- name: Contact form
  package: '@nera-static/plugin-contact-form'
  description:
      en: Renders a backend-free contact form that builds a mailto link on submit.
      de: Rendert ein Backend-freies Kontaktformular, das beim Absenden einen mailto-Link erzeugt.
      es: Renderiza un formulario de contacto sin backend que crea un enlace mailto al enviar.
  url: https://github.com/seebaermichi/nera-plugin-contact-form
- name: Feed
  package: '@nera-static/plugin-feed'
  description:
      en: Generates an Atom or RSS feed of your blog posts, one per language, and a link tag for the page head.
      de: Generiert einen Atom- oder RSS-Feed der Blogbeiträge, einen pro Sprache, und ein Link-Tag für den Seitenkopf.
      es: Genera un feed Atom o RSS de las entradas del blog, uno por idioma, y una etiqueta link para la cabecera de la página.
  url: https://github.com/seebaermichi/nera-plugin-feed
- name: Images
  package: '@nera-static/plugin-images'
  description:
      en: Generates responsive AVIF/WebP images with srcset, width/height and lazy loading at build time.
      de: Erzeugt beim Build responsive AVIF/WebP-Bilder mit srcset, width/height und Lazy Loading.
      es: Genera imágenes responsivas AVIF/WebP con srcset, width/height y carga diferida durante el build.
  url: https://github.com/seebaermichi/nera-plugin-images
- name: Link attributes
  package: '@nera-static/plugin-link-attributes'
  description:
      en: Rewrites links to add target, rel and other attributes.
      de: Schreibt Links um, um target, rel und andere Attribute hinzuzufügen.
      es: Reescribe los enlaces para añadir target, rel y otros atributos.
  url: https://github.com/seebaermichi/nera-plugin-link-attributes
- name: Navigation
  package: '@nera-static/plugin-navigation'
  description:
      en: Builds one or many navigations from config, with active states.
      de: Erstellt eine oder mehrere Navigationen aus der Konfiguration, mit aktiven Zuständen.
      es: Construye una o varias navegaciones a partir de la configuración, con estados activos.
  url: https://github.com/seebaermichi/nera-plugin-navigation
- name: One page
  package: '@nera-static/plugin-one-page'
  description:
      en: Assembles multiple sections into a single-page site.
      de: Fügt mehrere Abschnitte zu einer Single-Page-Website zusammen.
      es: Ensambla varias secciones en un sitio de una sola página.
  url: https://github.com/seebaermichi/nera-plugin-one-page
- name: Page data
  package: '@nera-static/plugin-page-data'
  description:
      en: Loads YAML data files into a page's meta.data, with translated fields resolved to the page's language.
      de: Lädt YAML-Datendateien in meta.data einer Seite und löst übersetzte Felder in die Sprache der Seite auf.
      es: Carga archivos de datos YAML en meta.data de una página y resuelve los campos traducidos al idioma de la página.
  url: https://github.com/seebaermichi/nera-plugin-page-data
- name: Page navigation
  package: '@nera-static/plugin-page-navigation'
  description:
      en: Links the sibling pages of a folder, or the entries a page lists in its frontmatter.
      de: Verlinkt die Geschwisterseiten eines Ordners oder die Einträge, die eine Seite in ihrem Frontmatter aufführt.
      es: Enlaza las páginas hermanas de una carpeta, o las entradas que una página lista en su frontmatter.
  url: https://github.com/seebaermichi/nera-plugin-page-navigation
- name: Page pagination
  package: '@nera-static/plugin-page-pagination'
  description:
      en: Previous/next links between sibling pages in a directory.
      de: Zurück-/Weiter-Links zwischen benachbarten Seiten in einem Verzeichnis.
      es: Enlaces anterior/siguiente entre páginas hermanas de un directorio.
  url: https://github.com/seebaermichi/nera-plugin-page-pagination
- name: Popular content
  package: '@nera-static/plugin-popular-content'
  description:
      en: Surfaces popular or featured pages in a list.
      de: Hebt beliebte oder empfohlene Seiten in einer Liste hervor.
      es: Muestra páginas populares o destacadas en una lista.
  url: https://github.com/seebaermichi/nera-plugin-popular-content
- name: Search
  package: '@nera-static/plugin-search'
  description:
      en: Generates a client-side search index and search box.
      de: Generiert einen clientseitigen Suchindex und ein Suchfeld.
      es: Genera un índice de búsqueda del lado del cliente y una caja de búsqueda.
  url: https://github.com/seebaermichi/nera-plugin-search
- name: Simple page list
  package: '@nera-static/plugin-simple-page-list'
  description:
      en: Renders a simple list of pages from a directory.
      de: Rendert eine einfache Liste von Seiten aus einem Verzeichnis.
      es: Renderiza una lista simple de páginas de un directorio.
  url: https://github.com/seebaermichi/nera-plugin-simple-page-list
- name: Sitemap
  package: '@nera-static/plugin-sitemap'
  description:
      en: Generates a sitemap.xml of every rendered page and a robots.txt pointing to it.
      de: Generiert eine sitemap.xml aller gerenderten Seiten und eine robots.txt, die darauf verweist.
      es: Genera un sitemap.xml de todas las páginas renderizadas y un robots.txt que apunta a él.
  url: https://github.com/seebaermichi/nera-plugin-sitemap
- name: Social media links
  package: '@nera-static/plugin-social-media-links'
  description:
      en: Renders configurable social media icon links.
      de: Rendert konfigurierbare Social-Media-Icon-Links.
      es: Renderiza enlaces de iconos de redes sociales configurables.
  url: https://github.com/seebaermichi/nera-plugin-social-media-links
- name: Stacks
  package: '@nera-static/plugin-stacks'
  description:
      en: Groups related content into reusable stacks.
      de: Gruppiert zusammengehörige Inhalte in wiederverwendbare Stacks.
      es: Agrupa contenido relacionado en stacks reutilizables.
  url: https://github.com/seebaermichi/nera-plugin-stacks
- name: Statistics
  package: '@nera-static/plugin-statistics'
  description:
      en: Computes reading time and other per-page statistics.
      de: Berechnet die Lesezeit und weitere Statistiken pro Seite.
      es: Calcula el tiempo de lectura y otras estadísticas por página.
  url: https://github.com/seebaermichi/nera-plugin-statistics
- name: Structured data
  package: '@nera-static/plugin-structured-data'
  description:
      en: Adds schema.org JSON-LD to every page, with the site entity, WebSite and BlogPosting, for search engines and AI assistants.
      de: Ergänzt jede Seite um schema.org-JSON-LD mit Website-Betreiber, WebSite und BlogPosting, für Suchmaschinen und KI-Assistenten.
      es: Añade JSON-LD de schema.org a cada página, con la entidad del sitio, WebSite y BlogPosting, para buscadores y asistentes de IA.
  url: https://github.com/seebaermichi/nera-plugin-structured-data
- name: Tags
  package: '@nera-static/plugin-tags'
  description:
      en: Tag pages and auto-generated tag overview pages.
      de: Tag-Seiten und automatisch generierte Tag-Übersichtsseiten.
      es: Páginas de etiquetas y páginas de resumen de etiquetas generadas automáticamente.
  url: https://github.com/seebaermichi/nera-plugin-tags

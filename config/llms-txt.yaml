# H1 and one-paragraph summary at the top of llms.txt.
title: Nera
summary: Nera is a lightweight, plugin-based static site generator for Node.js. You write Markdown with YAML frontmatter, template with Pug, and extend the build with small single-purpose npm plugins; one CLI, `@nera-static/nera`, scaffolds, builds, previews, validates and updates a site.

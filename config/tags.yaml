# Tutorial tagging. Overview pages are generated per language under
# tag_overview_path — /tutorials/tags for English, /de/... and /es/... for the
# others. No prefix_default_lang here: English is served from the root, so its
# tag pages stay unprefixed too.
meta_property_name: tags
tag_overview_path: '/tutorials/tags'
group_by_lang: true
tag_separator: ','
tag_overview_layout: pages/tag-overview.pug

tag_overview_meta:
    description: Nera tutorials and guides grouped by topic.
    keywords: nera, tutorials, guides, static site generator

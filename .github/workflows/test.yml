name: Test

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # Node 20 reached end of life on 2026-04-30, and the dev
                # toolchain (vitest 5) needs Node 22.12 or later, so CI tests
                # 22 and 24. `engines` is unchanged: a CI-only change.
                node-version: [22, 24]

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            # Local plugins under plugins/ carry their own node:test files beside
            # them. The glob in `npm test` is expanded by the shell, not by Node,
            # so it behaves the same on every Node version in the matrix.
            - name: Run local plugin tests
              run: npm test

            # Beyond the local plugins this is a Nera site, not a library: there
            # is no unit-test suite. What can actually break here is the content
            # and the templates, so the build is the test — it fails on a bad
            # layout, a missing include or malformed frontmatter — and
            # `nera validate` reports the same class of problem with file/line
            # detail.
            - name: Validate site
              run: npm run validate

            # `--check` then checks the built public/ for accessibility, privacy
            # and legal-notice problems (`nera check`). Every finding is a
            # warning unless config/validate.yaml promotes a rule to error, so
            # this fails only on a rule promoted there.
            - name: Build and check site
              run: npm run build -- --check

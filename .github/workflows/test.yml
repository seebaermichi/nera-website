name: Test

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # Node 18 reached EOL 2025-04-30 and the toolchain
                # (vitest 4 / vite 8 / eslint 10) requires Node 20+, so the
                # floor is Node 20 to match the `engines` field.
                node-version: [20, 22]

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            # This is a Nera site, not a library: there is no unit-test suite to
            # run. What can actually break here is the content and the templates,
            # so the build is the test — it fails on a bad layout, a missing
            # include or malformed frontmatter — and `nera validate` reports the
            # same class of problem with file/line detail.
            - name: Validate site
              run: npm run validate

            - name: Build site
              run: npm run build

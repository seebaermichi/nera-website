name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    # Allow a manual run from the Actions tab.
    workflow_dispatch:

# Least-privilege token: read the repo, write the Pages deployment, and prove
# the deploy job's identity to Pages via OIDC.
permissions:
    contents: read
    pages: write
    id-token: write

# Never run two deploys at once; let an in-progress run finish rather than
# cancelling it mid-publish.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Render site
              run: npm run build

            # The theme demos are scaffolded from the starters' latest
            # releases (scripts/theme-demos.js), so the cache key names those
            # versions: a new starter release starts a new cache, restored
            # from the previous one (plugin-images keys its variants by
            # content, so an older cache only means more work, never a stale
            # image).
            - name: Look up the demo starters' versions
              id: starters
              run: |
                  versions=$(node --input-type=module -e "import { DEMOS } from './scripts/theme-demos.js'; for (const demo of Object.values(DEMOS)) console.log(demo.starter)" \
                      | while read -r starter; do echo "${starter#@nera-static/starter-}-$(npm view "$starter" version)"; done \
                      | paste -sd_ -)
                  echo "versions=$versions" >> "$GITHUB_OUTPUT"

            - name: Cache the theme demos' image variants
              uses: actions/cache@v6
              with:
                  path: .theme-demos/cache
                  key: theme-demos-${{ steps.starters.outputs.versions }}
                  restore-keys: theme-demos-

            # After the site's own build, which deletes public/, and before the
            # upload; a failed demo stops the deploy and the live site stays.
            - name: Build the theme demos
              run: npm run build:demos

            - name: Check the theme demos
              run: npm run check:demos

            - name: Configure Pages
              uses: actions/configure-pages@v6

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: public

    deploy:
        needs: build
        runs-on: ubuntu-latest

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5

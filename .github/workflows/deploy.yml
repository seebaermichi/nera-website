name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    # Allow a manual run from the Actions tab.
    workflow_dispatch:

# Least-privilege token: read the repo, write the Pages deployment, and prove
# the deploy job's identity to Pages via OIDC.
permissions:
    contents: read
    pages: write
    id-token: write

# Never run two deploys at once; let an in-progress run finish rather than
# cancelling it mid-publish.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js 20
              uses: actions/setup-node@v7
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Render site
              run: npm run build

            - name: Configure Pages
              uses: actions/configure-pages@v6

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: public

    deploy:
        needs: build
        runs-on: ubuntu-latest

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
